<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 · WebUI 后台任务卡片（20261104-005）</title>
<style>
  :root {
    --brand: #007470; --brand-weak: rgba(0, 116, 112, .10);
    --ok: #1f8f4e; --ok-weak: rgba(31, 143, 78, .10);
    --warn: #a86400; --warn-weak: rgba(168, 100, 0, .12);
    --danger: #b42318; --danger-weak: rgba(180, 35, 24, .10);
    --text: #1c2126; --text-2: #5b6670; --text-3: #8a949d;
    --panel: #ffffff; --bg: #f4f6f6; --line: #e3e8e8; --line-strong: #cfd6d6;
    --radius-card: 10px; --shadow-card: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  }
  [data-theme="dark"] {
    --text: #e6ebee; --text-2: #a8b3ba; --text-3: #7c878e;
    --panel: #191e22; --bg: #111519; --line: #2a3238; --line-strong: #39434a;
    --brand: #34b3ab; --brand-weak: rgba(52, 179, 171, .14);
    --ok: #4cc27c; --ok-weak: rgba(76, 194, 124, .14);
    --warn: #d9a441; --warn-weak: rgba(217, 164, 65, .14);
    --danger: #ef6a5e; --danger-weak: rgba(239, 106, 94, .14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page { max-width: 860px; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .page-head h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .page-head p { margin: 2px 0 0; color: var(--text-3); font-size: 12.5px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button {
    border: 0; background: transparent; color: var(--text-2); padding: 6px 12px; cursor: pointer;
    font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button[aria-pressed="true"] { background: var(--brand-weak); color: var(--brand); font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--line); }
  .hint { color: var(--text-3); font-size: 12px; margin: 14px 0 18px; }
  .stream { display: grid; gap: 14px; }

  /* ===== 工具卡外框（与 ToolCard 一致） ===== */
  .tool-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); overflow: hidden;
  }
  .tc-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .tc-ico { width: 16px; height: 16px; color: var(--brand); flex: 0 0 auto; }
  .tc-name { font-weight: 600; font-size: 13px; }
  .tc-brief { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-body { padding: 10px 12px 12px; }

  /* ===== 后台任务卡 ===== */
  .bgc { display: grid; gap: 8px; }
  .bgc-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bgc-ico {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    background: var(--brand-weak); color: var(--brand); flex: 0 0 auto;
  }
  .bgc-cmd {
    flex: 1 1 auto; min-width: 0; font: 600 13.5px/1.4 var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bgc-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .icon-btn {
    width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line);
    background: var(--panel); color: var(--text-2); border-radius: 7px; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--text); }
  .icon-btn svg { width: 14px; height: 14px; }
  .stop-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px;
    border: 1px solid var(--danger); color: var(--danger); background: var(--danger-weak);
    border-radius: 7px; font: 600 12px/1 inherit; cursor: pointer;
  }
  .stop-btn svg { width: 12px; height: 12px; }

  .bgc-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--text-3); }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
    border-radius: 999px; font: 600 11.5px/1 inherit; border: 1px solid transparent;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.run { color: var(--brand); background: var(--brand-weak); border-color: var(--brand); }
  .pill.run .dot { animation: pulse 1.4s ease-in-out infinite; }
  .pill.ok { color: var(--ok); background: var(--ok-weak); border-color: var(--ok); }
  .pill.warn { color: var(--warn); background: var(--warn-weak); border-color: var(--warn); }
  .pill.danger { color: var(--danger); background: var(--danger-weak); border-color: var(--danger); }
  .pill.dim { color: var(--text-3); background: transparent; border-color: var(--line-strong); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .kv { font-variant-numeric: tabular-nums; }
  .kv b { color: var(--text-2); font-weight: 600; }
  .bgc-spacer { flex: 1 1 auto; }
  .link-btn {
    border: 0; background: transparent; color: var(--brand); font: 600 12px/1 inherit;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 4px 2px;
  }
  .link-btn svg { width: 12px; height: 12px; transition: transform .15s; }
  .link-btn[aria-expanded="true"] svg { transform: rotate(90deg); }

  .bgc-log {
    border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--bg) 70%, var(--panel));
    overflow: hidden;
  }
  .bgc-log-head {
    display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-bottom: 1px solid var(--line);
    color: var(--text-3); font-size: 11.5px;
  }
  .bgc-log-head .spacer { flex: 1; }
  .bgc-log-body {
    margin: 0; padding: 8px 10px; max-height: 168px; overflow: auto;
    font: 12px/1.65 var(--mono); color: var(--text-2); white-space: pre; tab-size: 2;
  }
  .bgc-log-body .ok { color: var(--ok); }
  .bgc-log-body .er { color: var(--danger); }
  .bgc-empty {
    padding: 18px 10px; text-align: center; color: var(--text-3); font-size: 12.5px;
    border: 1px dashed var(--line-strong); border-radius: 8px;
  }
  @media (max-width: 720px) {
    body { padding: 20px 12px 44px; }
    .page-head { flex-direction: column; align-items: stretch; }
    .bgc-top { flex-wrap: wrap; }
    .bgc-cmd { flex: 1 0 100%; white-space: normal; }
    .bgc-actions { order: 3; margin-left: auto; }
    .bgc-meta { font-size: 11.5px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="page-head">
    <div>
      <h1>后台任务卡片</h1>
      <p>需求 20261104-005 · ToolCard 结果区替换 · 亮/暗双主题</p>
    </div>
    <div class="seg" role="group" aria-label="主题切换">
      <button id="btn-light" aria-pressed="true" onclick="setTheme('light')">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        浅色
      </button>
      <button id="btn-dark" aria-pressed="false" onclick="setTheme('dark')">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        深色
      </button>
    </div>
  </header>
  <p class="hint">状态覆盖：运行中（轮询 2s）→ 已完成 / 失败 / 已停止 / 失联 / 日志已清理。展开日志取最后 20 行或 2KB，自动滚到底部。</p>

  <div class="stream" id="stream"></div>
</div>

<script>
const ICONS = {
  terminal: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
};

const CARDS = [
  {
    taskId: 'bg_3f9a12cd_1762350001',
    command: 'npm run dev',
    tone: 'run', label: '运行中', running: true,
    elapsed: '00:12', exit: null, size: '3.2 KB',
    log: [
      '> vite --port 3099',
      '',
      '  VITE v6.3.5  ready in 312 ms',
      '',
      '  ➜  Local:   http://127.0.0.1:3099/',
      '  ➜  Network: use --host to expose',
      '  ➜  press h + enter to show help',
      '  <span class="ok">[vue] build completed</span>',
      '  hmr update /src/App.vue',
    ].join('\n'),
  },
  {
    taskId: 'bg_71c0e4aa_1762348902',
    command: 'npm test -- --run',
    tone: 'ok', label: '已完成', running: false,
    elapsed: '00:47', exit: 0, size: '18.6 KB',
    log: [
      ' RUN  v4.1.10  D:/workspace/loop-agent-command',
      '',
      '  <span class="ok">✓ tests/command-background.test.ts (15 tests)</span>',
      '  <span class="ok">✓ tests/background-log-rotation.test.ts (7 tests)</span>',
      '  <span class="ok">✓ tests/tool-meta.test.ts (21 tests)</span>',
      '',
      '  Test Files  137 passed (137)',
      '       Tests  1438 passed (1438)',
      '    Duration  98.42s',
    ].join('\n'),
  },
  {
    taskId: 'bg_9d2b7c51_1762347003',
    command: 'npx tsc --noEmit',
    tone: 'danger', label: '失败（退出码 2）', running: false,
    elapsed: '00:08', exit: 2, size: '1.4 KB',
    log: [
      '<span class="er">src/tools/background-tasks.ts(112,7): error TS2322:</span>',
      '  Type \'string | undefined\' is not assignable to type \'string\'.',
      '<span class="er">src/api/router.ts(140,5): error TS2304:</span>',
      '  Cannot find name \'handleBackgroundTask\'.',
    ].join('\n'),
  },
  {
    taskId: 'bg_55ac019e_1762346104',
    command: 'npm run build:sea',
    tone: 'warn', label: '已停止', running: false,
    elapsed: '01:03', exit: null, size: '6.7 KB',
    log: [
      '> node scripts/build-sea.mjs',
      '  [1/5] esbuild src/index.ts → build/index.cjs',
      '  [2/5] 生成 blob …',
      '  <span class="er">^C 用户停止（commandStop）</span>',
    ].join('\n'),
  },
  {
    taskId: 'bg_2c8fb4d7_1762300005',
    command: 'sleep 300 && ls',
    tone: 'dim', label: '日志已清理', running: false,
    elapsed: '00:00', exit: null, size: '0 B', cleaned: true, log: '',
  },
];

function card(c) {
  const running = c.running;
  const expandId = `log-${c.taskId}`;
  const canStop = c.tone === 'run' || c.tone === 'warn' && !c.cleaned;
  return `
  <article class="tool-card" data-task="${c.taskId}">
    <div class="tc-head">
      <span class="tc-ico">${ICONS.terminal}</span>
      <span class="tc-name">运行命令</span>
      <span class="tc-brief">${c.command}</span>
    </div>
    <div class="tc-body">
      <div class="bgc">
        <div class="bgc-top">
          <span class="bgc-ico">${ICONS.terminal}</span>
          <span class="bgc-cmd" title="${c.command}">${c.command}</span>
          <span class="bgc-actions">
            ${running ? `<button class="stop-btn" title="停止任务">${ICONS.stop}停止</button>` : ''}
            <button class="icon-btn" title="刷新状态" aria-label="刷新状态">${ICONS.refresh}</button>
          </span>
        </div>
        <div class="bgc-meta">
          <span class="pill ${c.tone}"><span class="dot"></span>${c.label}</span>
          <span class="kv">耗时 <b>${c.elapsed}</b></span>
          ${c.exit !== null ? `<span class="kv">退出码 <b>${c.exit}</b></span>` : ''}
          <span class="kv">日志 <b>${c.size}</b></span>
          <span class="bgc-spacer"></span>
          ${c.cleaned
            ? `<span class="kv" style="color:var(--text-3)">记录已清理</span>`
            : `<button class="link-btn" aria-expanded="${running ? 'true' : 'false'}" aria-controls="${expandId}" onclick="toggleLog('${expandId}', this)">
                 ${running ? '收起日志' : '展开日志'} ${ICONS.chevron}
               </button>`}
        </div>
        ${c.cleaned
          ? `<div class="bgc-empty">该任务日志已按保留策略清理，仅保留状态记录</div>`
          : `<div class="bgc-log" id="${expandId}" ${running ? '' : 'hidden'}>
               <div class="bgc-log-head">
                 <span>最后 20 行 · tail 2KB</span><span class="spacer"></span>
                 <span>${running ? '每 2s 刷新，页面隐藏时降为 15s' : '已停止刷新'}</span>
               </div>
               <pre class="bgc-log-body">${c.log}</pre>
             </div>`}
      </div>
    </div>
  </article>`;
}

document.getElementById('stream').innerHTML = CARDS.map(card).join('');

function toggleLog(id, btn) {
  const box = document.getElementById(id);
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  box.hidden = open;
  btn.firstChild.textContent = open ? ' 展开日志 ' : ' 收起日志 ';
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.getElementById('btn-light').setAttribute('aria-pressed', String(theme === 'light'));
  document.getElementById('btn-dark').setAttribute('aria-pressed', String(theme === 'dark'));
  syncQuery();
}

function syncQuery() {
  const q = new URLSearchParams(location.search);
  q.set('theme', document.documentElement.dataset.theme);
  history.replaceState(null, '', `${location.pathname}?${q}`);
}

const initialTheme = new URLSearchParams(location.search).get('theme');
if (initialTheme === 'dark') setTheme('dark');
</script>
</body>
</html>
